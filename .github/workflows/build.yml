name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The projects target .NET Framework 2.0, which windows-latest doesn't install. MSBuild reads the
  # reference assemblies from this NuGet package instead.
  NET20_REF_VERSION: 1.0.3
  NUNIT_RUNNERS_VERSION: 2.6.4
  ACE_X64_URL: https://download.microsoft.com/download/3/5/C/35C84C36-661A-44E6-9324-8786B8DBE231/accessdatabaseengine_X64.exe

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: diff
        name: Skip the Windows build when only docs and agent config changed
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] || [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=$(git diff --name-only "$BASE" "$HEAD" \
            | grep -v -E '\.md$|^\.claude/|^\.opencode/|^\.markdownlint|^opencode\.json$|^\.github/workflows/markdown-lint\.yml$|^\.github/dependabot\.yml$' \
            | head -1)
          if [ -n "$code" ]; then echo "code=true"; else echo "code=false"; fi >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.configuration }} ${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        platform: [x86, x64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Fetch .NET Framework 2.0 reference assemblies
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'net20-ref'
          $nupkg = "$dir.zip"
          Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/microsoft.netframework.referenceassemblies.net20/$env:NET20_REF_VERSION/microsoft.netframework.referenceassemblies.net20.$env:NET20_REF_VERSION.nupkg" -OutFile $nupkg
          Expand-Archive $nupkg $dir
          "NET20_REF_ROOT=$dir\build\" >> $env:GITHUB_ENV

      - name: Build solution
        shell: pwsh
        # Packages are committed under packages/, so the legacy NuGet.targets restore is skipped.
        run: >-
          msbuild PlaneDisaster.NET.sln -m -nologo -v:minimal
          "-p:Configuration=${{ matrix.configuration }}"
          "-p:Platform=${{ matrix.platform }}"
          -p:RestorePackages=false
          -warnaserror -p:TreatWarningsAsErrors=true
          "-p:TargetFrameworkRootPath=$env:NET20_REF_ROOT"
          "-p:FrameworkPathOverride=$($env:NET20_REF_ROOT).NETFramework\v2.0"

      # Jet 4.0 is 32 bit only, so the x64 tests need the 64 bit Access Database Engine.
      - name: Install Access Database Engine 2016 (x64)
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'accessdatabaseengine_X64.exe'
          Invoke-WebRequest $env:ACE_X64_URL -OutFile $exe
          $p = Start-Process $exe -ArgumentList '/quiet', '/norestart' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Access Database Engine install exited with $($p.ExitCode)" }

      - name: Fetch NUnit 2.6 console runner
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'nunit'
          Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/nunit.runners/$env:NUNIT_RUNNERS_VERSION/nunit.runners.$env:NUNIT_RUNNERS_VERSION.nupkg" -OutFile "$dir.zip"
          Expand-Archive "$dir.zip" $dir
          "NUNIT_TOOLS=$dir\tools" >> $env:GITHUB_ENV

      - name: Run unit tests
        shell: pwsh
        # The test assembly targets CLR 2, which the runner doesn't have, so NUnit runs it on CLR 4.
        run: |
          $console = if ('${{ matrix.platform }}' -eq 'x86') { 'nunit-console-x86.exe' } else { 'nunit-console.exe' }
          $dll = "UnitTests\bin\${{ matrix.platform }}\${{ matrix.configuration }}\UnitTests.dll"
          & "$env:NUNIT_TOOLS\$console" $dll /framework:net-4.0 /noshadow /nologo /result:TestResult.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: TestResult-${{ matrix.configuration }}-${{ matrix.platform }}
          path: TestResult.xml
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PlaneDisaster-${{ matrix.configuration }}-${{ matrix.platform }}
          path: |
            bin/${{ matrix.platform }}/${{ matrix.configuration }}/
            */bin/${{ matrix.platform }}/${{ matrix.configuration }}/
          if-no-files-found: error

  # The one required check: it passes when the build passed or was skipped for a docs-only change.
  result:
    name: CI result
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1;; esac
