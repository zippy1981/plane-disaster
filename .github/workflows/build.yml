name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  # release.yml calls this to build the MSIs it publishes.
  workflow_call:
    outputs:
      version:
        description: The AssemblyVersion from AssemblyInfo.cs, which is also the MSI version.
        value: ${{ jobs.changes.outputs.version }}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The SDK that builds every framework, including net11.0-windows.
  DOTNET_VERSION: 11.0.x
  NUNIT_RUNNERS_VERSION: 2.6.4
  ACE_X64_URL: https://download.microsoft.com/download/3/5/C/35C84C36-661A-44E6-9324-8786B8DBE231/accessdatabaseengine_X64.exe

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: version
        name: Read the version from AssemblyInfo.cs
        run: |
          version=$(grep -oP 'AssemblyVersion\("\K[0-9.]+' AssemblyInfo.cs)
          echo "version=$version" | tee -a "$GITHUB_OUTPUT"

      - id: diff
        name: Skip the Windows build when only docs and agent config changed
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] || [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=$(git diff --name-only "$BASE" "$HEAD" \
            | grep -v -E '\.md$|^\.claude/|^\.opencode/|^\.markdownlint|^opencode\.json$|^\.github/workflows/markdown-lint\.yml$|^\.github/dependabot\.yml$' \
            | head -1)
          if [ -n "$code" ]; then echo "code=true"; else echo "code=false"; fi >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.framework }} ${{ matrix.configuration }} ${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # net20 is what ships. net481 and net11.0-windows build the same SDK-style projects for the
        # latest .NET Framework and the latest .NET, to catch API and warning breaks; Release is enough.
        framework: [net20, net481, net11.0-windows]
        configuration: [Debug, Release]
        platform: [x86, x64]
        exclude:
          - framework: net481
            configuration: Debug
          - framework: net11.0-windows
            configuration: Debug
    env:
      FRAMEWORK: ${{ matrix.framework }}
      CONFIGURATION: ${{ matrix.configuration }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The projects list net11.0-windows, so every leg needs a .NET SDK that knows it.
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
        if: matrix.framework != 'net11.0-windows'

      - name: Restore
        shell: pwsh
        run: dotnet restore PlaneDisaster.NET.sln -nologo "-p:Platform=$env:PLATFORM"

      # Full framework MSBuild compiles the .NET Framework legs: it embeds the forms' non-string .resx
      # resources the way .NET Framework 2.0 reads them, which dotnet build cannot.
      - name: Build solution
        shell: pwsh
        run: |
          $common = @("PlaneDisaster.NET.sln", "-nologo", "-warnaserror", "-p:TreatWarningsAsErrors=true",
            "-p:Configuration=$env:CONFIGURATION", "-p:Platform=$env:PLATFORM", "-p:TargetFramework=$env:FRAMEWORK")
          if ($env:FRAMEWORK -eq 'net11.0-windows') {
            dotnet build @common --no-restore
          } else {
            msbuild @common -m -v:minimal
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Jet 4.0 is 32 bit only, so the x64 tests need the 64 bit Access Database Engine.
      - name: Install Access Database Engine 2016 (x64)
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'accessdatabaseengine_X64.exe'
          Invoke-WebRequest $env:ACE_X64_URL -OutFile $exe
          $p = Start-Process $exe -ArgumentList '/quiet', '/norestart' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Access Database Engine install exited with $($p.ExitCode)" }

      - name: Fetch NUnit 2.6 console runner
        if: matrix.framework != 'net11.0-windows'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'nunit'
          Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/nunit.runners/$env:NUNIT_RUNNERS_VERSION/nunit.runners.$env:NUNIT_RUNNERS_VERSION.nupkg" -OutFile "$dir.zip"
          Expand-Archive "$dir.zip" $dir
          "NUNIT_TOOLS=$dir\tools" >> $env:GITHUB_ENV

      - name: Run unit tests (NUnit 2.6)
        if: matrix.framework != 'net11.0-windows'
        shell: pwsh
        # NUnit runs every .NET Framework build on CLR 4; the net20 test assembly targets CLR 2, which the runner doesn't have.
        run: |
          $console = if ($env:PLATFORM -eq 'x86') { 'nunit-console-x86.exe' } else { 'nunit-console.exe' }
          $dll = "UnitTests\bin\$env:PLATFORM\$env:CONFIGURATION\$env:FRAMEWORK\UnitTests.dll"
          & "$env:NUNIT_TOOLS\$console" $dll /framework:net-4.0 /noshadow /nologo /result:TestResult.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # setup-dotnet installs only the x64 runtime, so the x86 .NET build is compiled but not tested.
      - name: Run unit tests (dotnet test)
        if: matrix.framework == 'net11.0-windows' && matrix.platform == 'x64'
        shell: pwsh
        run: >-
          dotnet test UnitTests --no-build -nologo
          -c $env:CONFIGURATION -f $env:FRAMEWORK "-p:Platform=$env:PLATFORM"
          --logger "trx;LogFileName=$env:GITHUB_WORKSPACE\TestResult.trx"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: TestResult-${{ matrix.framework }}-${{ matrix.configuration }}-${{ matrix.platform }}
          path: |
            TestResult.xml
            TestResult.trx
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PlaneDisaster-${{ matrix.framework }}-${{ matrix.configuration }}-${{ matrix.platform }}
          path: |
            bin/${{ matrix.platform }}/${{ matrix.configuration }}/${{ matrix.framework }}/
            */bin/${{ matrix.platform }}/${{ matrix.configuration }}/${{ matrix.framework }}/
          if-no-files-found: error

      # The MSI and portable zip ship the net20 build.
      - name: Build the MSI
        if: matrix.configuration == 'Release' && matrix.framework == 'net20'
        shell: pwsh
        run: >-
          dotnet build "PlaneDisaster.NET Setup" -c Release -nologo -warnaserror
          "-p:Platform=$env:PLATFORM" -p:AppTargetFramework=net20
          "-p:PlaneDisasterVersion=${{ needs.changes.outputs.version }}"

      - name: Stage the portable zip contents
        if: matrix.configuration == 'Release' && matrix.framework == 'net20'
        shell: pwsh
        run: |
          $dir = New-Item -ItemType Directory -Force portable
          Copy-Item "bin\$env:PLATFORM\Release\net20\*" $dir -Exclude *.xml, *.pdb
          Copy-Item "Jet2SQLite\bin\$env:PLATFORM\Release\net20\Jet2SQLite.exe*" $dir
          Copy-Item gpl.txt, README.md $dir

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.configuration == 'Release' && matrix.framework == 'net20'
        with:
          name: msi-${{ matrix.platform }}
          path: PlaneDisaster.NET Setup/bin/${{ matrix.platform }}/Release/*.msi
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.configuration == 'Release' && matrix.framework == 'net20'
        with:
          name: portable-${{ matrix.platform }}
          path: portable/
          if-no-files-found: error

  # The one required check: it passes when the build passed or was skipped for a docs-only change.
  result:
    name: CI result
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1;; esac
